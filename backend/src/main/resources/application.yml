spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: reading-tracker-api
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: reading-tracker-api
    access-ttl-minutes: 15
    refresh-ttl-days: 7
  storage:
    directory: ${CSV_DATA_DIR:./data}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
